# Document words (spec 9). A hit always protects the file: it is never suggested as junk.
phrases:
  - aadhaar
  - aadhar
  - pan
  - driving licence
  - passport
  - voter
  - invoice
  - receipt
  - bill
  - ticket
  - boarding pass
  - pnr
  - otp
  - upi
  - transaction
  - account no
  - ifsc
  - policy
  - prescription
  - report
  - certificate
  - admit card
  - hall ticket
  - payslip
  - salary
regexes:
  - '[0-9]{4} ?[0-9]{4} ?[0-9]{4}'
  - '[A-Z]{5}[0-9]{4}[A-Z]'
  - '[A-Z]{4}0[A-Z0-9]{6}'
