name: CI

# Lint, Python tests, web tests and end-to-end tests on every push and pull request (macOS,
# Apple Silicon). Release builds are in release.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        # astral-sh/setup-uv v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Set up Node
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint (ruff, mypy)
        run: make lint

      - name: Python tests
        run: make test
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Web lint, typecheck, unit tests
        run: |
          npm --prefix web ci
          make web-test

      - name: Install Playwright WebKit
        run: npm --prefix web exec playwright install webkit

      - name: End-to-end tests
        run: make e2e

      - name: Upload Playwright artifacts
        if: failure()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
