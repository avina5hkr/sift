name: Bug report
description: Something in Sift does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **remove anything private** (file names, phone serials, paths with your name) from what you paste.
        If the problem could let Sift delete or change files it should not, or exposes data, please report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the phone by USB
        2. Open Free space → Duplicates
        3. ...
  - type: input
    id: version
    attributes:
      label: Sift version
      description: Settings → General → About.
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version (if it involves the phone)
      placeholder: Android 15
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Wi-Fi
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → General → Open the logs and export diagnostics. Paste the relevant lines (after removing anything private).
      render: text
